<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — LOCO</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧭</text></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar">
  <div class="container">
    <a href="index.html" class="brand"><span class="brand-mark">L</span>LOCO</a>
    <div class="nav-links"></div>
    <div class="nav-actions">
      <button class="icon-btn" id="themeToggle" aria-label="Toggle dark mode"><span class="theme-icon">🌙</span></button>
    </div>
  </div>
</nav>

<div class="auth-wrap">
  <div class="panel auth-card">
    <h2 style="margin-top:0;">Welcome back</h2>
    <p class="muted" style="margin-top:-8px;">Sign in to your LOCO account</p>

    <div class="demo-account-box">
      <b>Demo account:</b> use any email + password (4+ characters), or tap the button below to sign in instantly as <b>Ananya Rao</b>.
    </div>
    <button class="btn btn-outline btn-block mb-16" id="demoLoginBtn">⚡ Continue with Demo Account</button>

    <form id="loginForm" novalidate>
      <div class="form-group">
        <label for="loginEmail">Email</label>
        <input type="email" id="loginEmail" placeholder="you@example.com">
        <div class="error-text">Enter a valid email</div>
      </div>
      <div class="form-group">
        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" placeholder="••••••••">
        <div class="error-text">Password must be at least 4 characters</div>
      </div>
      <button class="btn btn-primary btn-block" type="submit">Sign In</button>
    </form>
    <div class="auth-switch">Don't have an account? <a href="register.html">Create one</a></div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
