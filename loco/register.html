<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account — LOCO</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧭</text></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar">
  <div class="container">
    <a href="index.html" class="brand"><span class="brand-mark">L</span>LOCO</a>
    <div class="nav-links"></div>
    <div class="nav-actions">
      <button class="icon-btn" id="themeToggle" aria-label="Toggle dark mode"><span class="theme-icon">🌙</span></button>
    </div>
  </div>
</nav>

<div class="auth-wrap">
  <div class="panel auth-card">
    <h2 style="margin-top:0;">Join LOCO</h2>
    <p class="muted" style="margin-top:-8px;">Create your community account</p>

    <form id="registerForm" novalidate>
      <div class="form-group">
        <label for="regName">Full Name</label>
        <input type="text" id="regName" placeholder="e.g. Ananya Rao">
        <div class="error-text">Enter your full name</div>
      </div>
      <div class="form-group">
        <label for="regEmail">Email</label>
        <input type="email" id="regEmail" placeholder="you@example.com">
        <div class="error-text">Enter a valid email</div>
      </div>
      <div class="form-group">
        <label for="regPassword">Password</label>
        <input type="password" id="regPassword" placeholder="••••••••">
        <div class="error-text">Password must be at least 4 characters</div>
      </div>
      <div class="form-group">
        <label for="regLocation">Community Area</label>
        <input type="text" id="regLocation" placeholder="e.g. RS Puram">
        <div class="error-text">Tell us your area</div>
      </div>
      <button class="btn btn-primary btn-block" type="submit">Create Account</button>
    </form>
    <div class="auth-switch">Already have an account? <a href="login.html">Sign in</a></div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
